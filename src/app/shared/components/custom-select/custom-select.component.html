<div class="custom-select">
  <div class="selected" (click)="toggleDropdown()">
    {{ selectedItem?.name || 'Select an item' }}
  </div>
  <div class="options" *ngIf="isDropdownOpen">
    <table>
      <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let item of items" (click)="selectItem(item)">
        <td>{{ item.id }}</td>
        <td>{{ item.name }}</td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
