<h1>Angular Router Sample</h1>
<nav>
  <a class="button" routerLink="/router-sample/crisis/crisis-center">Crisis Center</a> |
  <a class="button" routerLink="/router-sample/superheroes/heroes-list">Heroes</a> |
  <a class="button" routerLink="/router-sample/admin" routerLinkActive="active">Admin</a> |

</div>
<router-outlet name="popup"></router-outlet>
